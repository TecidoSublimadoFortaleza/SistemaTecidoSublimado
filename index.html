<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tecido-Sublimado</title>
    <meta name="description" content="ERP Corporativo de Missão Crítica para Indústria de Sublimação e Têxtil" />

    <!-- Favicon & Mobile Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preload Critical Login Assets for Instant Rendering -->
    <link rel="preload" as="image" href="/images/fundo.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/logo-web.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/TSF-web.webp" type="image/webp" />

    <!-- CLÁUSULA DE PROTEÇÃO CONTRA REGRESSÃO: Preload dinâmico ultra-rápido do Tema Ativo antes do bundle React -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('subligestao_active_theme');
          var active = raw ? JSON.parse(raw) : null;
          if (!active) {
            var rawList = localStorage.getItem('subligestao_custom_themes_cache');
            if (rawList) {
              var list = JSON.parse(rawList);
              if (Array.isArray(list)) {
                active = list.find(function(t) { return t && (t.displayTheme || t.is_active); });
              }
            }
          }
          if (active) {
            var bgUrl = (active.loginSettings && active.loginSettings.bg70Url) || active.bg70Url;
            if (bgUrl && typeof bgUrl === 'string' && bgUrl.length > 3 && !bgUrl.startsWith('data:')) {
              var cleanUrl = bgUrl.startsWith('public/') ? '/' + bgUrl.replace(/^public\//, '') : bgUrl;
              var link = document.createElement('link');
              link.rel = 'preload';
              link.as = 'image';
              link.href = cleanUrl;
              link.fetchPriority = 'high';
              document.head.appendChild(link);
            }
            if (active.palette && active.palette.sidebarBg) {
              document.documentElement.style.setProperty('--theme-sidebar-bg', active.palette.sidebarBg);
              document.documentElement.style.setProperty('--theme-header-bg', active.palette.headerBg);
            }
          }
        } catch (_) {}
      })();
    </script>

    <!-- Mobile Browser Chrome & Theme -->
    <meta name="theme-color" content="#52658b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SISTEMA ERP TSF" />

    <!-- Open Graph (WhatsApp, Telegram, Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tecido-Sublimado" />
    <meta property="og:title" content="Tecido-Sublimado" />
    <meta property="og:description" content="ERP Corporativo de Missão Crítica para Indústria de Sublimação e Têxtil" />
    <meta property="og:image" content="/images/TSF-web.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Tecido-Sublimado" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tecido-Sublimado" />
    <meta name="twitter:description" content="ERP Corporativo de Missão Crítica para Indústria de Sublimação e Têxtil" />
    <meta name="twitter:image" content="/images/TSF-web.webp" />
    <script>
      // Universal Error Suppressor for cross-origin scripts, iframes, WebSockets, and ResizeObserver
      function isBenignError(msg, err) {
        var text = String(msg || '') + ' ' + (err && err.message ? String(err.message) : '') + ' ' + (err && err.stack ? String(err.stack) : '');
        text = text.toLowerCase();
        return (
          text.includes('script error') ||
          text.includes('websocket') ||
          text.includes('resizeobserver') ||
          text.includes('failed to fetch') ||
          text.includes('networkerror') ||
          text.includes('load failed') ||
          text.includes('cross-origin') ||
          text.includes('blocked a frame')
        );
      }

      window.onerror = function (message, source, lineno, colno, error) {
        if (isBenignError(message, error)) {
          return true; // Prevents default error reporting
        }
        return false;
      };

      // Prevent unhandled rejection noise
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var reasonMsg = reason && (typeof reason === 'string' ? reason : reason.message || reason.stack || '');
        if (isBenignError(reasonMsg, reason)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });

      // Suppress error event propagation for cross-origin and benign errors
      window.addEventListener(
        'error',
        function (event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (isBenignError(msg, event.error)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        },
        true
      );

      // Register Service Worker for PWA installation support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // Ignored if in sandbox or unsupported
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
