<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%" fx="45%" fy="25%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#ringGrad)" stroke-width="8" filter="url(#shadow)" />
  <circle cx="200" cy="200" r="188" fill="url(#bgGrad)" />

  <!-- Top Logo TSF -->
  <g transform="translate(200, 95)" text-anchor="middle">
    <!-- Stylized cloud/fabric curve -->
    <path d="M -70 -25 C -50 -45 50 -45 70 -25 C 90 -5 70 20 50 20 L -50 20 C -70 20 -90 -5 -70 -25 Z" fill="#ffffff" fill-opacity="0.15" />
    
    <!-- Colorful dots representing sublimation color spectrum -->
    <circle cx="-42" cy="-28" r="6" fill="#f43f5e" />
    <circle cx="-28" cy="-33" r="6" fill="#fb923c" />
    <circle cx="-14" cy="-36" r="6" fill="#facc15" />
    <circle cx="0" cy="-37" r="6" fill="#4ade80" />
    <circle cx="14" cy="-36" r="6" fill="#22d3ee" />
    <circle cx="28" cy="-33" r="6" fill="#818cf8" />
    <circle cx="42" cy="-28" r="6" fill="#c084fc" />

    <text y="-8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="-0.5">Tecido Sublimado</text>
    <text y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#7dd3fc" letter-spacing="1">FORTALEZA</text>
  </g>

  <!-- Middle Name: MARCELO GOMES -->
  <g transform="translate(200, 215)" text-anchor="middle">
    <text y="-8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="1.5">MARCELO</text>
    <text y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#ffffff" letter-spacing="2">GOMES</text>
  </g>

  <!-- Bottom Badge: DESENVOLVEDOR / SUPORTE -->
  <g transform="translate(200, 312)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow)" />
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14.5" fill="#f0f9ff" text-anchor="middle" letter-spacing="1.2">DESENVOLVEDOR / SUPORTE</text>
  </g>

  <!-- Shine effect on top right -->
  <path d="M 330 110 A 175 175 0 0 0 240 35 A 185 185 0 0 1 355 170 A 175 175 0 0 0 330 110 Z" fill="#ffffff" fill-opacity="0.12" />
</svg>
